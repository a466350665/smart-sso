server:
  port: 8080

spring:
  profiles:
    # 默认 dev：H2 内存库，jar 开箱即用，无需任何外部依赖
    # 生产请显式指定：--spring.profiles.active=prod 或 SPRING_PROFILES_ACTIVE=prod
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

#  data:
#    redis:
#      host: 127.0.0.1
#      port: 6379
#      password: 123456

mybatis-plus:
  global-config:
    db-config:
      table-prefix: sso_

logging:
  level:
    openjoe.smart.sso.server.mapper: debug #打印sql日志

smart:
  sso:
    #服务端地址
    server-url: http://server.smart-sso.com:8080
    #客户端密钥信息
    client-id: 1000
    client-secret: rokY9BdKh5bHiX/zL26qOg==
    #忽略拦截urls（排出静态资源和登录、退出、OAuth2认证等请求）
    exclude-urls: /static/*,/sso/*,/auth/*,/login.html,/favicon.ico
    #单点登录超时时间，默认2小时，单位秒（服务端独有配置）
    server:
      timeout: 7200
    #前后端分离开关
    h5-enabled: true
