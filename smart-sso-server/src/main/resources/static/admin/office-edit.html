<title>机构管理</title>


<div class="page-header">
	<h1>
		机构
	</h1>
</div>

<div class="row">
	<div class="col-xs-12">
		<form id="_editForm" class="form-horizontal" role="form"
			validate="true">
			<input type="hidden" name="id" value=""> 
			
			<div class="form-group">
				<label for="_parentId" class="col-sm-3 control-label no-padding-right">父机构</label>

				<div class="col-sm-3">
					<select id="_parentId" name="parentId" class="form-control help-validate">
						<option value="">请选择</option>
						
					</select>
				</div>
			</div>
			

			<div class="form-group">
				<label for="_name" class="col-sm-3 control-label no-padding-right"><span class="form-star">*</span>名称</label>

				<div class="col-sm-9">
					<div class="clearfix help-validate">
						<input id="_name" name="name" type="text" value="" class="form-data col-xs-10 col-sm-5" placeholder="名称"
							required="true"  maxlength="100"/>
					</div>
				</div>
				
			</div>
			<div class="form-group">
				<label for="_sort" class="col-sm-3 control-label no-padding-right"><span class="form-star">*</span>排序</label>

				<div class="col-sm-9">
					<div class="clearfix help-validate">
						<input id="_sort" name="sort" type="text" value="" class="form-data col-xs-10 col-sm-5" placeholder="排序"
							required="true" vtype="integer" maxlength="11"/>
					</div>
				</div>
				
			</div>
			<div class="form-group">
				<label class="control-label col-xs-12 col-sm-3 no-padding-right"><span class="form-star">*</span>是否启用</label>

				<div class="col-xs-12 col-sm-9">
					<div class="clearfix help-validate">
						<div>
							<label class="line-height-1 blue">
								<input name="isEnable" value="true" type="radio" class="ace" checked="checked"/>
								<span class="lbl"> 是</span>
							</label>
						</div>
	
						<div>
							<label class="line-height-1 blue">
								<input name="isEnable" value="false" type="radio" class="ace" />
								<span class="lbl"> 否</span>
							</label>
						</div>
					</div>
				</div>
			</div>
			
			<div class="clearfix form-actions">
				<div class="col-md-offset-3 col-md-9">
					<button id="_submit" type="button" class="btn btn-info" data-loading-text="正在提交..." permission="/office/save.html">
						<i class="ace-icon fa fa-check bigger-110"></i>
						提交
					</button>

					&nbsp; &nbsp; &nbsp;
					<button id="_cancle" class="btn" type="reset">
						<i class="ace-icon fa  fa-times bigger-110"></i>
						取消
					</button>
				</div>
			</div>
		</form>

	</div>
</div>

<script type="text/javascript">
	$('.page-content-area').ace_ajax('loadScripts', scripts, function() {
		jQuery(function($) {
			function getParam(name) {
				var query = window.location.hash.substring(1);
				var vars = query.split("?");
				for (var i = 0; i < vars.length; i++) {
					var pair = vars[i].split("=");
					if (pair[0] == name) { return pair[1]; }
				}
				return null;
			}

			function loadOffice(officeId) {
				$.getJSON("/admin/office/get?id=" + officeId, function (d) {
					if (!d || d.code !== '000000' || !d.data) {
						return;
					}
					var office = d.data;
					$("input[name='id']").val(office.id || '');
					$("#_name").val(office.name || '');
					$("#_sort").val(office.sort == null ? '' : office.sort);
					if (office.isEnable === false) {
						$("input[name='isEnable'][value='false']").prop('checked', true);
					} else {
						$("input[name='isEnable'][value='true']").prop('checked', true);
					}
					loadParents(officeId, office.parentId);
				});
			}

			function loadParents(excludeId, selectedId) {
				var url = "/admin/office/all";
				if (excludeId) {
					url += "?excludeId=" + excludeId;
				}
				$.getJSON(url, function (d) {
					if (!d || d.code !== '000000') {
						return;
					}
					var html = '<option value="">请选择</option>';
					(d.data || []).forEach(function (item) {
						var selected = selectedId && String(item.id) === String(selectedId) ? ' selected="selected"' : '';
						html += '<option value="' + item.id + '"' + selected + '>' + item.name + '</option>';
					});
					$('#_parentId').html(html);
				});
			}

			var officeId = getParam('id');
			if (officeId) {
				loadOffice(officeId);
			} else {
				loadParents(null, getParam('parentId'));
			}

			// 提交
			$("#_submit").click(function(){
				if($('#_editForm').validate()){
					var btn = $(this);
					btn.button('loading');
					$.post("/admin/office/save", $.formJson('_editForm'),function(d) {
						if(d){
							btn.button('reset');
							if(d.code == '000000'){
								$.aceRedirect("/office");
							}
							else {
								$.gritter.add({text: d.message});
							}
						}
					},'json');
				}
			});
			
			// 取消
			$("#_cancle").click(function(){
				$.aceRedirect("/office");
			});
			
			// 回车绑定
			$(".form-data").bind('keypress',function(event){
				if(event.keyCode == "13"){
                	event.preventDefault();
                	$("#_submit").click();
				}
			});
            
			// 权限处理
			$.permission();
		});
	});
</script>
