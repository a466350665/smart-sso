<title>用户管理</title>


<div class="page-header">
	<h1>
		用户
	</h1>
</div>

<div class="row">
	<div class="col-xs-12">
		<!-- PAGE CONTENT BEGINS -->
		<form id="_editForm" class="form-horizontal" role="form" 
			validate="true">
			<input type="hidden" name="id" value="">
			
			<div class="form-group">
				<label for="_officeId" class="col-sm-3 control-label no-padding-right"><span class="form-star">*</span>机构</label>

				<div class="col-sm-3">
					<select id="_officeId" name="officeId" class="form-control help-validate" required="true"></select>
				</div>
			</div>
			
			<div class="form-group">
				<label for="_name" class="col-sm-3 control-label no-padding-right">姓名</label>

				<div class="col-sm-6">
					<div class="clearfix help-validate">
						<input id="_name" name="name" type="text" value="" class="form-data col-xs-10 col-sm-5" placeholder="名称"
							maxlength="50"/>
					</div>
				</div>
				
			</div>
			
			<div class="form-group">
				<label for="_account" class="col-sm-3 control-label no-padding-right"><span class="form-star">*</span>登录名</label>

				<div class="col-sm-9">
					<div class="input-medium help-validate">
						<div class="input-group">
							<input id="_account" name="account" type="text" value="" class="form-data"
								ajax="{url : '/user/validate-account', dataId : '_editForm'}"
								required="true" minlength = '4' maxlength = '64'/>
							<span class="input-group-addon">
								<i class="ace-icon fa fa-user"></i>
							</span>
						</div>
					</div>
				</div>
				
			</div>
			
			<div class="form-group">
				<label for="_password" class="col-sm-3 control-label no-padding-right"><span class="form-star">*</span>密码</label>
				
				<div class="col-sm-9">
					<div class="input-medium help-validate">
						<div class="input-group">
							<input id="_password" name="password" type="password" value="" class="form-data" required="true" minlength = '6' maxlength = '16'/>
							<span class="input-group-addon">
								<i class="ace-icon fa fa-lock"></i>
							</span>
						</div>
					</div>
				</div>
			</div>
			
			<div class="form-group">
				<label class="control-label col-xs-12 col-sm-3 no-padding-right"><span class="form-star">*</span>是否启用</label>

				<div class="col-xs-12 col-sm-9">
					<div class="clearfix help-validate">
						<div>
							<label class="line-height-1 blue">
								<input name="isEnable" value="true" type="radio" class="ace" checked="checked"/>
								<span class="lbl"> 是</span>
							</label>
						</div>
	
						<div>
							<label class="line-height-1 blue">
								<input name="isEnable" value="false" type="radio" class="ace" />
								<span class="lbl"> 否</span>
							</label>
						</div>
					</div>
				</div>
			</div>
			
			<div class="clearfix form-actions">
				<div class="col-md-offset-3 col-md-9">
					<button id="_submit" type="button" class="btn btn-info" data-loading-text="正在提交...">
						<i class="ace-icon fa fa-check bigger-110"></i>
						提交
					</button>

					&nbsp; &nbsp; &nbsp;
					<button id="_cancle" class="btn" type="reset">
						<i class="ace-icon fa  fa-times bigger-110"></i>
						取消
					</button>
				</div>
			</div>
		</form>

	</div>
</div>

<script type="text/javascript">
	$('.page-content-area').ace_ajax('loadScripts', scripts, function() {
		jQuery(function($) {
			function getParam(name) {
				var query = window.location.search.substring(1);
				var vars = query.split("&");
				for (var i = 0; i < vars.length; i++) {
					var pair = vars[i].split("=");
					if (pair[0] == name) { return pair[1]; }
				}
				return null;
			}

			function loadOffices(selectedId) {
				$.getJSON("/meta/offices", function (d) {
					if (!d || d.code !== '000000') {
						return;
					}
					var html = '<option value="">请选择</option>';
					(d.data || []).forEach(function (item) {
						var selected = selectedId && String(item.id) === String(selectedId) ? ' selected="selected"' : '';
						html += '<option value="' + item.id + '"' + selected + '>' + item.name + '</option>';
					});
					$('#_officeId').html(html);
				});
			}

			function loadUser(userId) {
				$.getJSON("/meta/user?id=" + userId, function (d) {
					if (!d || d.code !== '000000') {
						return;
					}
					var user = d.data || {};
					$("input[name='id']").val(user.id || '');
					$("#_name").val(user.name || '');
					$("#_account").val(user.account || '');
					if (user.isEnable === false) {
						$("input[name='isEnable'][value='false']").prop('checked', true);
					} else {
						$("input[name='isEnable'][value='true']").prop('checked', true);
					}
					loadOffices(user.officeId);
				});
			}

			var userId = getParam('id');
			if (userId) {
				loadUser(userId);
				$("#_password").prop('required', false);
				$("label[for='_password'] .form-star").remove();
			} else {
				loadOffices(getParam('officeId'));
			}

			$("#_account").focus();

			// 提交
			$("#_submit").click(function(){
				if($('#_editForm').validate()){
					var btn = $(this);
					btn.button('loading');
					$.post("/user/save", $.formJson('_editForm'),function(d) {
						if(d){
							btn.button('reset');
							if(d.code == '000000'){
								$.aceRedirect("/user");
							}
							else {
								$.gritter.add({text: d.message});
							}
						}
			        },'json');
				}
			});
			
			// 取消
			$("#_cancle").click(function(){
				$.aceRedirect("/user");
			});
			
			// 回车绑定
			$(".form-data").bind('keypress',function(event){
                if(event.keyCode == "13"){
                	event.preventDefault();
                	$("#_submit").click();
                }
            });
		});
	});
</script>
