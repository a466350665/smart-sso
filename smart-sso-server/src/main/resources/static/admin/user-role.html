<title>分配角色</title>


<div class="page-header">
	<h1>
		分配角色
	</h1>
</div>

<div class="row">
	<div class="col-xs-12">
		<!-- PAGE CONTENT BEGINS -->
		<form id="_editForm" class="form-horizontal" role="form" 
			validate="true">
			<input type="hidden" name="userId" value="">
			
			<div class="form-group">
				<label for="_name" class="col-sm-3 control-label no-padding-right">姓名</label>

				<div class="col-sm-6">
					<div class="clearfix help-validate">
						<input id="_name" name="name" type="text" value="" class="form-data col-xs-10 col-sm-5" placeholder="名称"
							maxlength="50" disabled="disabled"/>
					</div>
				</div>
				
			</div>
			
			<div class="form-group">
				<label class="col-sm-3 control-label no-padding-right">角色</label>
				
				<div class="col-xs-12 col-sm-9">
					<div class="clearfix help-validate">
						<div id="_roleList"></div>
						<input id="_roleIds" type="hidden" name="roleIds" value="">
					</div>
				</div>
			</div>
			
			<div class="clearfix form-actions">
				<div class="col-md-offset-3 col-md-9">
					<button id="_submit" type="button" class="btn btn-info" data-loading-text="正在提交...">
						<i class="ace-icon fa fa-check bigger-110"></i>
						提交
					</button>

					&nbsp; &nbsp; &nbsp;
					<button id="_cancle" class="btn" type="reset">
						<i class="ace-icon fa  fa-times bigger-110"></i>
						取消
					</button>
				</div>
			</div>
		</form>

	</div>
</div>

<script type="text/javascript">
	$('.page-content-area').ace_ajax('loadScripts', scripts, function() {
		jQuery(function($) {
			function getParam(name) {
				var query = window.location.hash.substring(1);
				var vars = query.split("?");
				for (var i = 0; i < vars.length; i++) {
					var pair = vars[i].split("=");
					if (pair[0] == name) { return pair[1]; }
				}
				return null;
			}

			function loadUser(userId) {
				$.getJSON("/admin/meta/user?id="+ userId, function (d) {
					if (!d || d.code !== '000000') {
						return;
					}
					var user = d.data || {};
					$("input[name='userId']").val(user.id || '');
					$("#_name").val(user.name || '');
				});
			}

			function loadRoles(userId) {
				$.getJSON("/admin/meta/roles?userId="+ (userId || ''), function (d) {
					if (!d || d.code !== '000000') {
						return;
					}
					var html = '';
					(d.data || []).forEach(function (item) {
						var checked = item.checked ? ' checked="checked"' : '';
						html += '<label>';
						html += '<input name="roleId" value="' + item.id + '" type="checkbox" class="ace"' + checked + '/>';
						html += '<span class="lbl">&nbsp;&nbsp;' + item.name + '</span>';
						html += '</label>';
					});
					$('#_roleList').html(html);
				});
			}

			var userId = getParam('userId');
			if (userId) {
				loadUser(userId);
				loadRoles(userId);
			}

			// 提交
			$("#_submit").click(function(){
				if($('#_editForm').validate()){
					var roleIds = "";
					$("input[name='roleId']:checked").each(function(i, d){
						if(i > 0){
							roleIds += ",";
						}
						roleIds += $(this).val();
					});
					$("#_roleIds").val(roleIds);
					
					var btn = $(this);
					btn.button('loading');
					$.post("/admin/user-role/save", $.formJson('_editForm'),function(d) {
						if(d){
							btn.button('reset');
							if(d.code == '000000'){
								$.aceRedirect("/user");
							}
							else {
								$.gritter.add({text: d.message});
							}
						}
			        },'json');
				}
			});
			
			// 取消
			$("#_cancle").click(function(){
				$.aceRedirect("/user");
			});
			
			// 回车绑定
			$(".form-data").bind('keypress',function(event){
                if(event.keyCode == "13"){
                	event.preventDefault();
                	$("#_submit").click();
                }
            });
		});
	});
</script>
