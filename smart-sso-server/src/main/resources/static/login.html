<!DOCTYPE html>
<html>

    <head>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <meta charset="utf-8" />
        <title>Smart-SSO登录页</title>

        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
        <link type="images/x-icon" rel="shortcut icon" href="/static/custom/assets/favicon.ico">

        <!-- bootstrap & fontawesome -->
        <link rel="stylesheet" href="/static/assets/css/bootstrap.css" />
        <link rel="stylesheet" href="/static/assets/css/font-awesome.css" />

        <!-- text fonts -->
        <link rel="stylesheet" href="/static/assets/css/ace-fonts.css" />

        <!-- ace styles -->
        <link rel="stylesheet" href="/static/assets/css/ace.css" />

        <!--[if lte IE 9]>
        <link rel="stylesheet" href="/static/assets/css/ace-part2.css" />
        <![endif]-->
        <link rel="stylesheet" href="/static/assets/css/ace-rtl.css" />

        <!--[if lte IE 9]>
        <link rel="stylesheet" href="/static/assets/css/ace-ie.css" />
        <![endif]-->

        <!-- HTML5 shim and Respond.js IE8 support of HTML5 elements and media queries -->
        <!--[if lt IE 9]>
        <script src="/static/assets/js/html5shiv.js"></script>
        <script src="/static/assets/js/respond.js"></script>
        <![endif]-->
    </head>

    <body class="login-layout">
        <div class="main-container">
            <div class="main-content">
                <div class="row">
                    <div class="col-sm-10 col-sm-offset-1">
                        <div class="login-container">
                            <div class="center">
                                <h1>
                                    <i class="ace-icon fa fa-leaf green"></i>
                                    <span class="white" id="id-text2">Smart-SSO认证中心</span>
                                </h1>
                            </div>

                            <div class="space-6"></div>

                            <div class="position-relative">
                                <div id="login-box" class="login-box visible widget-box no-border">
                                    <div class="widget-body">
                                        <div class="widget-main">
                                            <h4 class="header blue lighter bigger">
                                                <i class="ace-icon fa fa-coffee green"></i>
                                                请填写登录信息
                                            </h4>

                                            <div class="space-6"></div>

                                            <form id="_loginForm">
                                                <input type="hidden" id="_redirectUri" />
                                                <input type="hidden" id="_clientId" />
                                                <fieldset>
                                                    <label class="block clearfix form-group">
                                                        <span class="block input-icon input-icon-right help-validate">
                                                            <input id="_username" name="username" value="admin" type="text"
                                                                   class="form-control form-data" placeholder="登录名" required="true"
                                                                   minlength="4" />
                                                            <i class="ace-icon fa fa-user"></i>
                                                        </span>
                                                    </label>

                                                    <label class="block clearfix form-group">
                                                        <span class="block input-icon input-icon-right help-validate">
                                                            <input id="_password" name="password" value="123456" type="password"
                                                                   class="form-control form-data" placeholder="密码" required="true"
                                                                   minlength="6" maxlength="16" />
                                                            <i class="ace-icon fa fa-lock"></i>
                                                        </span>
                                                    </label>

                                                    <div class="space"></div>

                                                    <div class="clearfix">
                                                        <label class="inline">
                                                            <input id="_rememberMe" type="checkbox" class="ace" checked="" />
                                                            <span class="lbl"> 记住我</span>
                                                        </label>

                                                        <button id="_loginButton" type="button"
                                                                class="width-35 pull-right btn btn-sm btn-primary">
                                                            <i class="ace-icon fa fa-key"></i>
                                                            <span class="bigger-110">登录</span>
                                                        </button>
                                                    </div>

                                                    <div class="space-4"></div>
                                                </fieldset>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="navbar-fixed-top align-right">
                                <br />
                                &nbsp;
                                <a id="btn-login-dark" href="#">Dark</a>
                                &nbsp;
                                <span class="blue">/</span>
                                &nbsp;
                                <a id="btn-login-blur" href="#">Blur</a>
                                &nbsp;
                                <span class="blue">/</span>
                                &nbsp;
                                <a id="btn-login-light" href="#">Light</a>
                                &nbsp; &nbsp; &nbsp;
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="/static/assets/js/jquery.js"></script>
        <script src="/static/custom/jquery.cookie.js"></script>
        <script src="/static/custom/jquery.form.min.js"></script>
        <script src="/static/custom/jquery.validate-2.0.min.js"></script>
        <script src="/static/custom/jquery.validate-2.0.custom.min.js"></script>

        <script type="text/javascript">
            jQuery(function($) {
                var redirectUri = getParam('redirectUri');
                var clientId = getParam('clientId');
                if (!redirectUri || !clientId) {
                    alert("缺少必要参数");
                    return;
                }
                $("#_redirectUri").val(redirectUri);
                $("#_clientId").val(clientId);

                $('#btn-login-dark').on('click', function(e) {
                    $('body').attr('class', 'login-layout');
                    $('#id-text2').attr('class', 'white');
                    e.preventDefault();
                });
                $('#btn-login-light').on('click', function(e) {
                    $('body').attr('class', 'login-layout light-login');
                    $('#id-text2').attr('class', 'grey');
                    e.preventDefault();
                });
                $('#btn-login-blur').on('click', function(e) {
                    $('body').attr('class', 'login-layout blur-login');
                    $('#id-text2').attr('class', 'white');
                    e.preventDefault();
                });

                $("#_loginButton").click(function() {
                    if ($('#_loginForm').validate()) {
                        if ($('#_rememberMe:checked').length > 0) {
                            $.cookie('_username', $("#_username").val());
                        } else {
                            $.removeCookie('_username');
                        }

                        $.ajax({
                            url: "/sso/login",
                            type: "POST",
                            dataType: "json",
                            data: {
                                redirectUri: $("#_redirectUri").val(),
                                clientId: $("#_clientId").val(),
                                username: $("#_username").val(),
                                password: $("#_password").val()
                            },
                            success: function(res) {
                                if (res.code === '000000') {
                                    window.location.href = res.data;
                                } else {
                                    alert(res.message || "登录失败");
                                }
                            },
                            error: function(xhr) {
                                alert(xhr.responseText || "登录请求失败");
                            }
                        });
                    }
                });

                // 回车绑定
                $(".form-data").bind('keypress', function(event) {
                    if (event.keyCode == "13") {
                        event.preventDefault();
                        $("#_loginButton").click();
                    }
                });
            });

            function getParam(name) {
                var query = window.location.search.substring(1);
                var vars = query.split("&");
                for (var i = 0; i < vars.length; i++) {
                    var pair = vars[i].split("=");
                    if (pair[0] == name) { return pair[1]; }
                }
                return null;
            }
        </script>
    </body>
</html>
